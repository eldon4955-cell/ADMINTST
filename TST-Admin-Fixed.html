<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TST Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#050000;color:#eee;font-family:Arial,Helvetica,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(120deg,#000,#120000,#700000,#090000,#000);background-size:400% 400%;animation:bg 12s ease infinite}@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}button,input{font:inherit}.hidden{display:none!important}.wrap{max-width:1050px;margin:auto;padding:20px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.card{background:rgba(11,9,9,.95);border:1px solid #402020;border-radius:18px;padding:22px;box-shadow:0 0 35px rgba(100,0,0,.25)}.login .box{width:min(430px,100%);text-align:center}h1,h2{margin-top:0}.red{color:#ff4444}.muted{color:#999}.input{width:100%;padding:13px;margin:8px 0;background:#090909;color:#fff;border:1px solid #492020;border-radius:10px;outline:none}.input:focus{border-color:#f33;box-shadow:0 0 0 2px rgba(255,0,0,.12)}.btn{border:1px solid #702020;background:#160808;color:#ff5555;padding:11px 16px;border-radius:10px;cursor:pointer}.btn:hover{background:#e22;color:#fff}.danger{border-color:#7b2020}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.stat{font-size:32px;font-weight:800;color:#fff}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #281515;flex-wrap:wrap}.item:last-child{border-bottom:0}.status{margin-top:10px;color:#ff8888;min-height:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}a.btn{text-decoration:none;display:inline-block}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:20px}.modal .box{width:min(520px,100%)}small{color:#777}@media(max-width:600px){.wrap{padding:12px}.box,.card{padding:17px}.actions{width:100%}.actions .btn{flex:1}}</style></head><body><section id="login" class="login"><div class="box"><h1 class="red">TST ADMIN</h1><p class="muted">Authorized site management</p><input id="user" class="input" placeholder="Username" autocomplete="username"><input id="pass" class="input" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn" class="btn" type="button">SIGN IN</button><div id="loginStatus" class="status"></div><small>TST Modding Administration</small></div></section><main id="app" class="wrap hidden"><div class="top"><div><h1 class="red">TST ADMIN PANEL</h1><span class="muted">Manage your website downloads and updates</span></div><button id="logout" class="btn" type="button">LOG OUT</button></div><div class="grid"><div class="card"><div class="muted">Downloads</div><div id="count" class="stat">0</div></div><div class="card"><div class="muted">Updates</div><div id="updates" class="stat">0</div></div><div class="card"><div class="muted">Site status</div><div class="stat red">ONLINE</div></div></div><div class="card" style="margin-top:15px"><div class="top"><h2>DOWNLOADS</h2><button id="add" class="btn" type="button">+ ADD DOWNLOAD</button></div><div id="list"></div></div><div class="card" style="margin-top:15px"><div class="top"><h2>UPDATES</h2><button id="addUpdate" class="btn" type="button">+ ADD UPDATE</button></div><div id="updateList"></div></div></main><div id="modal" class="modal hidden"><div class="box"><h2 class="red">ADD DOWNLOAD</h2><input id="name" class="input" placeholder="Name"><input id="url" class="input" placeholder="Download URL"><input id="desc" class="input" placeholder="Description"><div class="actions"><button id="save" class="btn" type="button">SAVE</button><button id="close" class="btn" type="button">CANCEL</button></div><div id="modalStatus" class="status"></div></div></div><script>(()=>{"use strict";const U="admin",P="4011917735@)/!&:53TSTONTOP",D="tstAdminData_v2",S="tstAdminSession_v2",$=id=>document.getElementById(id),def={downloads:[{name:"Singularity",url:"https://github.com/Lumince/singularity/releases/latest",desc:"Official release page"}],updates:[]};function load(){try{const r=localStorage.getItem(D);if(!r)return structuredClone(def);const p=JSON.parse(r);return{downloads:Array.isArray(p.downloads)?p.downloads:[],updates:Array.isArray(p.updates)?p.updates:[]}}catch{return structuredClone(def)}}let data=load();const save=()=>localStorage.setItem(D,JSON.stringify(data));const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const valid=v=>{try{let u=new URL(v);return u.protocol==="http:"||u.protocol==="https:"}catch{return false}};function render(){$("count").textContent=data.downloads.length;$("updates").textContent=data.updates.length;$("list").innerHTML=data.downloads.length?data.downloads.map((x,i)=>`<div class="item"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.desc||"")}</div></div><div class="actions"><a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">OPEN</a><button class="btn danger" data-d="${i}" type="button">DELETE</button></div></div>`).join(""):"<p class=\"muted\">No downloads.</p>";$("updateList").innerHTML=data.updates.length?data.updates.map((x,i)=>`<div class="item"><b>${esc(x)}</b><button class="btn danger" data-u="${i}" type="button">DELETE</button></div>`).join(""):"<p class=\"muted\">No updates.</p>";document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{data.downloads.splice(+b.dataset.d,1);save();render()});document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{data.updates.splice(+b.dataset.u,1);save();render()})}function app(){$("login").classList.add("hidden");$("app").classList.remove("hidden");render()}function login(){$("app").classList.add("hidden");$("login").classList.remove("hidden");$("pass").value=""}$("loginBtn").onclick=()=>{if($("user").value.trim()===U&&$("pass").value===P){sessionStorage.setItem(S,"1");app()}else $("loginStatus").textContent="Incorrect username or password."};[$("user"),$("pass")].forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")$("loginBtn").click()});$("logout").onclick=()=>{sessionStorage.removeItem(S);login()};$("add").onclick=()=>{$("modal").classList.remove("hidden");$("name").focus()};$("close").onclick=()=>$("modal").classList.add("hidden");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.add("hidden")};$("save").onclick=()=>{let name=$("name").value.trim(),url=$("url").value.trim(),desc=$("desc").value.trim();if(!name||!url){$("modalStatus").textContent="Name and URL are required.";return}if(!valid(url)){$("modalStatus").textContent="Use a valid http:// or https:// URL.";return}data.downloads.push({name,url,desc});save();$("name").value=$("url").value=$("desc").value="";$("modal").classList.add("hidden");render()};$("addUpdate").onclick=()=>{let v=prompt("Enter update text:");if(v&&v.trim()){data.updates.push(v.trim());save();render()}};if(sessionStorage.getItem(S)==="1")app()})();</script></body></html>
