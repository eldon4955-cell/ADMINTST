<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TST ADMIN</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#120000,#350000,#050505);color:#fff;padding:18px}.wrap{max-width:1000px;margin:auto}.card{background:#120909;border:1px solid #7b1111;border-radius:16px;padding:20px;box-shadow:0 0 30px #0008;margin-bottom:16px}h1,h2,h3{margin-top:0}h1{color:#ff3b3b}.muted{color:#aaa}.hidden{display:none!important}.row{display:flex;gap:9px;flex-wrap:wrap}input{width:100%;padding:12px;border-radius:10px;border:1px solid #661515;background:#090909;color:#fff;margin:7px 0}button{padding:11px 15px;border:0;border-radius:10px;background:#b31212;color:#fff;cursor:pointer;font-weight:800}button:hover{background:#e01919}.danger{background:#5d0000}.danger:hover{background:#900}.account{border:1px solid #4b1616;border-radius:12px;padding:15px;margin:12px 0;background:#0b0808}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{background:#090909;border-radius:10px;padding:12px}.error{color:#ff6666;margin-top:8px}.success{color:#62ff8b;margin-top:8px}.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}.info div{background:#090909;border-radius:9px;padding:10px}.info span{display:block;color:#888;font-size:12px;margin-bottom:4px}.info b{word-break:break-word}.search{margin-bottom:12px}</style></head><body><main class="wrap"><section id="login" class="card"><h1>TST ADMIN</h1><p class="muted">Manage TST Clicker accounts stored by this website.</p><input id="password" type="password" placeholder="Admin password"><button onclick="login()">ENTER ADMIN</button><div id="loginMsg" class="error"></div></section><section id="panel" class="hidden"><div class="card"><h1>TST ADMIN</h1><p class="muted">Account management for the TST Clicker website.</p><div class="row"><button onclick="refresh()">REFRESH</button><button onclick="logout()">LOG OUT</button><button class="danger" onclick="deleteAll()">DELETE EVERYONE'S ACCOUNT</button></div><div id="msg" class="success"></div></div><div class="card"><div class="grid"><div class="stat">Accounts: <b id="count">0</b></div><div class="stat">Total TSTs: <b id="total">0</b></div></div></div><div class="card"><h2>ACCOUNTS</h2><input class="search" id="search" placeholder="Search username or account ID" oninput="refresh()"><div id="accounts"></div></div></section></main><script>
const ADMIN_PASSWORD='xQ7!vP2#Lm9@rT6';
const KEY='tstAccountsV2',LEADER_KEY='tstLeaderboardV2',SESSION_KEY='tstSessionV2';
function getAccounts(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function saveAccounts(a){localStorage.setItem(KEY,JSON.stringify(a))}
function login(){if(document.getElementById('password').value===ADMIN_PASSWORD){sessionStorage.setItem('tstAdmin','1');showPanel()}else document.getElementById('loginMsg').textContent='Wrong password. Please try again.'}
function logout(){sessionStorage.removeItem('tstAdmin');location.reload()}
function showPanel(){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');refresh()}
function refresh(){const a=getAccounts(),q=(document.getElementById('search')?.value||'').trim().toLowerCase(),keys=Object.keys(a).filter(k=>{const x=a[k]||{};return !q||k.includes(q)||String(x.name||'').toLowerCase().includes(q)||String(x.accountId||'').toLowerCase().includes(q)});document.getElementById('count').textContent=Object.keys(a).length;document.getElementById('total').textContent=Object.values(a).reduce((n,x)=>n+Number(x?.game?.total||0),0).toLocaleString();const box=document.getElementById('accounts');box.innerHTML='';if(!keys.length){box.innerHTML='<p class="muted">No matching accounts.</p>';return}keys.forEach(k=>{const x=a[k]||{},g=x.game||{},d=document.createElement('div');d.className='account';d.innerHTML='<h3>'+esc(x.name||k)+'</h3><div class="info"><div><span>Username</span><b>'+esc(x.name||k)+'</b></div><div><span>Password</span><b>'+esc(x.password||'Unavailable')+'</b></div><div><span>Account ID</span><b>'+esc(x.accountId||'—')+'</b></div><div><span>TSTs</span><b>'+Number(g.total||0).toLocaleString()+'</b></div><div><span>Clicks</span><b>'+Number(g.clicks||0).toLocaleString()+'</b></div><div><span>Power</span><b>'+Number(g.power||1).toLocaleString()+'</b></div></div><div class="row"><button onclick="showInfo('+JSON.stringify(k)+')">SHOW INFORMATION</button><button onclick="editAccount('+JSON.stringify(k)+')">EDIT</button><button class="danger" onclick="deleteAccount('+JSON.stringify(k)+')">DELETE ACCOUNT</button></div><div id="info-'+esc(k)+'" class="hidden"></div>';box.appendChild(d)})}
function showInfo(k){const a=getAccounts()[k];if(!a)return;alert('Username: '+(a.name||k)+'\nPassword: '+(a.password||'Unavailable')+'\nAccount ID: '+(a.accountId||'—')+'\nTSTs: '+Number(a.game?.total||0).toLocaleString()+'\nClicks: '+Number(a.game?.clicks||0).toLocaleString()+'\nTST per click: '+Number(a.game?.power||1)+'\nAuto TST/sec: '+(Number(a.game?.cps||0)+Number(a.game?.factoryCps||0)))}
async function editAccount(k){const a=getAccounts(),x=a[k];if(!x)return;const name=prompt('Username:',x.name||k);if(name===null)return;const pass=prompt('Password:',x.password||'');if(pass===null)return;if(!/^[A-Za-z0-9_]{2,18}$/.test(name)){alert('Username must be 2–18 letters, numbers, or underscores.');return}if(name.toLowerCase()!==k&&a[name.toLowerCase()]){alert('That username is already taken.');return}const salt=crypto.getRandomValues(new Uint8Array(16)).reduce((r,v)=>r+v.toString(16).padStart(2,'0'),'');const data=new TextEncoder().encode(salt+':'+pass);const buf=await crypto.subtle.digest('SHA-256',data);x.name=name;x.password=pass;x.salt=salt;x.hash=[...new Uint8Array(buf)].map(v=>v.toString(16).padStart(2,'0')).join('');if(name.toLowerCase()!==k){delete a[k];a[name.toLowerCase()]=x}else a[k]=x;saveAccounts(a);refresh()}
function deleteAccount(k){const a=getAccounts(),x=a[k];if(!x)return;if(!confirm('Delete '+(x.name||k)+' and all of their TST Clicker progress?'))return;delete a[k];saveAccounts(a);const rows=JSON.parse(localStorage.getItem(LEADER_KEY)||'[]').filter(r=>String(r.name).toLowerCase()!==String(x.name||k).toLowerCase());localStorage.setItem(LEADER_KEY,JSON.stringify(rows));if(localStorage.getItem(SESSION_KEY)===k)localStorage.removeItem(SESSION_KEY);document.getElementById('msg').textContent='Account deleted.';refresh()}
function deleteAll(){const a=getAccounts();const n=Object.keys(a).length;if(!n){document.getElementById('msg').textContent='There are no accounts to delete.';return}if(!confirm('DELETE ALL '+n+' TST CLICKER ACCOUNTS? This cannot be undone.'))return;localStorage.removeItem(KEY);localStorage.removeItem(LEADER_KEY);localStorage.removeItem(SESSION_KEY);document.getElementById('msg').textContent=n+' account(s) deleted.';refresh()}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
if(sessionStorage.getItem('tstAdmin')==='1')showPanel();
</script></body></html>
