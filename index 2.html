<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TST Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#050000;color:#eee;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(120deg,#000,#120000,#700000,#090000,#000);background-size:400% 400%;animation:bg 12s ease infinite}@keyframes bg{50%{background-position:100% 50%}}button,input{font:inherit}.hidden{display:none!important}.wrap{max-width:1050px;margin:auto;padding:20px}.login{min-height:100vh;display:grid;place-items:center}.box,.card{background:#0b0909eF;border:1px solid #402020;border-radius:18px;padding:22px;box-shadow:0 0 35px #5004}.login .box{width:min(430px,100%)}h1,h2{margin-top:0}.red{color:#ff4444}.muted{color:#999}.input{width:100%;padding:13px;margin:8px 0;background:#090909;color:#fff;border:1px solid #492020;border-radius:10px}.btn{border:1px solid #702020;background:#160808;color:#ff5555;padding:11px 16px;border-radius:10px;cursor:pointer}.btn:hover,.danger:hover{background:#e22;color:#fff}.danger{border-color:#7b2020}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.stat{font-size:32px;font-weight:800;color:#fff}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #281515}.item:last-child{border-bottom:0}.status{margin-top:10px;color:#ff8888;min-height:18px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px}.modal .box{width:min(520px,100%)}a{color:#ff6666}</style></head><body>
<section id="login" class="login"><div class="box"><h1 class="red">TST ADMIN</h1><p class="muted">Authorized site management</p><input id="user" class="input" placeholder="Username" autocomplete="username"><input id="pass" class="input" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn" class="btn">SIGN IN</button><div id="loginStatus" class="status"></div><p class="muted" style="font-size:12px">This demo stores its session locally. For real multi-user authentication, connect it to a server/auth provider.</p></div></section>
<main id="app" class="wrap hidden"><div class="top"><div><h1 class="red">TST ADMIN PANEL</h1><span class="muted">Manage your website downloads and updates</span></div><button id="logout" class="btn">LOG OUT</button></div>
<div class="grid"><div class="card"><div class="muted">Downloads</div><div id="count" class="stat">0</div></div><div class="card"><div class="muted">Updates</div><div id="updates" class="stat">0</div></div><div class="card"><div class="muted">Site status</div><div class="stat red">ONLINE</div></div></div>
<div class="card" style="margin-top:15px"><div class="top"><h2>DOWNLOADS</h2><button id="add" class="btn">+ ADD DOWNLOAD</button></div><div id="list"></div></div>
<div class="card" style="margin-top:15px"><div class="top"><h2>UPDATES</h2><button id="addUpdate" class="btn">+ ADD UPDATE</button></div><div id="updateList"></div></div>
</main>
<div id="modal" class="modal hidden"><div class="box"><h2 id="modalTitle" class="red">Add Download</h2><input id="name" class="input" placeholder="Name"><input id="url" class="input" placeholder="Download URL"><input id="desc" class="input" placeholder="Description"><button id="save" class="btn">SAVE</button> <button id="close" class="btn">CANCEL</button><div id="modalStatus" class="status"></div></div></div>
<script>(()=>{const $=id=>document.getElementById(id);let data=JSON.parse(localStorage.getItem('tstAdminData')||'null')||{downloads:[{name:'Singularity',url:'https://github.com/Lumince/singularity/releases/latest',desc:'Official release page'}],updates:[]};function saveData(){localStorage.setItem('tstAdminData',JSON.stringify(data))}function render(){ $('count').textContent=data.downloads.length;$('updates').textContent=data.updates.length;$('list').innerHTML=data.downloads.length?data.downloads.map((x,i)=>`<div class="item"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.desc||'')}</div></div><div><a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">OPEN</a> <button class="btn danger" data-del="${i}">DELETE</button></div></div>`).join(''):'<p class="muted">No downloads.</p>';$('updateList').innerHTML=data.updates.length?data.updates.map((x,i)=>`<div class="item"><div><b>${esc(x)}</b></div><button class="btn danger" data-updel="${i}">DELETE</button></div>`).join(''):'<p class="muted">No updates.</p>';$('list').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{data.downloads.splice(+b.dataset.del,1);saveData();render()});$('updateList').querySelectorAll('[data-updel]').forEach(b=>b.onclick=()=>{data.updates.splice(+b.dataset.updel,1);saveData();render()})}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('loginBtn').onclick=()=>{if($('user').value.trim()&&$('pass').value){$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}else $('loginStatus').textContent='Enter your credentials.'};$('logout').onclick=()=>{ $('app').classList.add('hidden');$('login').classList.remove('hidden')};$('add').onclick=()=>{ $('modalTitle').textContent='ADD DOWNLOAD';$('modal').classList.remove('hidden');$('modalStatus').textContent=''};$('addUpdate').onclick=()=>{const v=prompt('Update text:');if(v&&v.trim()){data.updates.push(v.trim());saveData();render()}};$('close').onclick=()=> $('modal').classList.add('hidden');$('save').onclick=()=>{const n=$('name').value.trim(),u=$('url').value.trim(),d=$('desc').value.trim();if(!n||!u){$('modalStatus').textContent='Name and URL are required.';return}data.downloads.push({name:n,url:u,desc:d});saveData();$('modal').classList.add('hidden');$('name').value='';$('url').value='';$('desc').value='';render()};})();</script></body></html>
