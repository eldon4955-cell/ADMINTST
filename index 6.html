<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TST'S ADMIN PAGE</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#120000,#350000,#050505);color:#fff;padding:24px}button,input{font:inherit}.wrap{max-width:1000px;margin:auto}.card{background:#120909;border:1px solid #7b1111;border-radius:16px;padding:22px;box-shadow:0 0 30px #0008;margin-bottom:18px}h1{margin-top:0;color:#ff3b3b}.muted{color:#aaa}.hidden{display:none}.row{display:flex;gap:10px;flex-wrap:wrap}input{width:100%;padding:13px;border-radius:10px;border:1px solid #661515;background:#090909;color:#fff;margin:8px 0}button{padding:11px 15px;border:0;border-radius:10px;background:#b31212;color:#fff;cursor:pointer;font-weight:bold}button:hover{background:#e01919}.danger{background:#5d0000}.danger:hover{background:#900}.account{border:1px solid #4b1616;border-radius:12px;padding:15px;margin:12px 0;background:#0b0808}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.stat{background:#090909;border-radius:10px;padding:12px}.error{color:#ff6666;margin-top:8px}.success{color:#62ff8b;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="card">
<h1>TST'S ADMIN PAGE</h1>
<p class="muted">Admin password required.</p>
<input id="password" type="password" placeholder="Admin password">
<button onclick="login()">LOGIN</button>
<div id="loginMsg"></div>
</div>

<div id="panel" class="hidden">
<div class="card">
<div class="row" style="justify-content:space-between;align-items:center">
<h1>ADMIN DASHBOARD</h1><button onclick="logout()">LOG OUT</button>
</div>
<div class="grid">
<div class="stat">Accounts: <b id="count">0</b></div>
<div class="stat">Total TSTs: <b id="total">0</b></div>
</div>
</div>

<div class="card">
<h2>Accounts</h2>
<div class="row"><button onclick="refresh()">REFRESH</button><button class="danger" onclick="deleteAll()">DELETE ALL ACCOUNTS</button></div>
<div id="accounts"></div>
</div>
</div>
</div>
<script>
const ADMIN_PASSWORD='xQ7!vP2#Lm9@rT6';
const KEY='tstClickerAccounts';
function getAccounts(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}
function saveAccounts(a){localStorage.setItem(KEY,JSON.stringify(a))}
function login(){if(document.getElementById('password').value===ADMIN_PASSWORD){sessionStorage.setItem('tstAdmin','1');showPanel()}else{document.getElementById('loginMsg').className='error';document.getElementById('loginMsg').textContent='Wrong password. Please try again.'}}
function logout(){sessionStorage.removeItem('tstAdmin');location.reload()}
function showPanel(){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');refresh()}
function refresh(){const a=getAccounts(), keys=Object.keys(a);document.getElementById('count').textContent=keys.length;document.getElementById('total').textContent=keys.reduce((n,k)=>n+(Number(a[k].score||a[k].tsts||0)),0).toLocaleString();const box=document.getElementById('accounts');box.innerHTML='';if(!keys.length){box.innerHTML='<p class="muted">No accounts found in this browser.</p>';return}keys.forEach(k=>{const x=a[k]||{};const d=document.createElement('div');d.className='account';d.innerHTML=`<h3>${esc(x.username||x.name||k)}</h3><p>ID: ${esc(x.id||'N/A')}</p><p>Score/TSTs: ${Number(x.score||x.tsts||0).toLocaleString()}</p><div class="row"><button onclick="editAccount(${JSON.stringify(k)})">EDIT</button><button class="danger" onclick="deleteAccount(${JSON.stringify(k)})">DELETE</button></div>`;box.appendChild(d)})}
function editAccount(k){const a=getAccounts(),x=a[k]||{};const name=prompt('Username:',x.username||x.name||k);if(name===null)return;const score=prompt('Score / TSTs:',x.score??x.tsts??0);if(score===null)return;x.username=name;x.name=name;x.score=Number(score)||0;x.tsts=x.score;a[k]=x;saveAccounts(a);refresh()}
function deleteAccount(k){if(!confirm('Delete this account?'))return;const a=getAccounts();delete a[k];saveAccounts(a);refresh()}
function deleteAll(){if(!confirm('DELETE ALL ACCOUNTS? This cannot be undone.'))return;localStorage.removeItem(KEY);refresh()}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
if(sessionStorage.getItem('tstAdmin')==='1')showPanel();
</script>
</body>
</html>
